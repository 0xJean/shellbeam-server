name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (empty builds the selected ref as a development artifact)'
        type: string
        default: ''
      publish:
        description: 'Create a draft GitHub release for that existing tag'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: version
        name: Resolve the checked-out release identity
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [[ -z "$tag" && "$REF_TYPE" == tag ]]; then tag="$REF_NAME"; fi
          version=0.1.0-dev
          if [[ -n "$tag" ]]; then
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]] || { echo 'Expected a version tag such as v0.1.0'; exit 1; }
            [[ "$(git rev-parse "refs/tags/$tag^{commit}")" == "$(git rev-parse HEAD)" ]] || { echo 'Tag does not match the checked-out commit'; exit 1; }
            version="${tag#v}"
          elif [[ "$PUBLISH" == true ]]; then
            echo 'Publishing requires an existing version tag'; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Test and vet
        env:
          CGO_ENABLED: '1'
        run: make check

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.commit }}
      - name: Build Linux artifacts against Debian Bookworm
        env:
          SERVER_VERSION: ${{ needs.check.outputs.version }}
          VERSION_HASH: ${{ needs.check.outputs.commit }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          docker build --target artifacts --output type=local,dest=dist \
            --build-arg SERVER_VERSION="$SERVER_VERSION" \
            --build-arg VERSION_HASH="$VERSION_HASH" .
          name="shellbeam-server-${SERVER_VERSION}-linux-${ARCH}"
          mv dist "$name"
          mkdir dist
          tar -czf "dist/${name}.tar.gz" "$name"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: shellbeam-server-linux-${{ matrix.arch }}
          path: dist/*
          retention-days: 14

  draft-release:
    needs: [check, build]
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: shellbeam-server-linux-*
          path: dist
          merge-multiple: true
      - name: Create a draft release with the verified artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'A release already exists; refusing to replace its assets.'; exit 1
          fi
          gh release create "$TAG" dist/* --verify-tag --draft \
            --title "ShellBeam Server $TAG" \
            --notes 'ShellBeam Server is an independent Komari backend fork. These Linux amd64/arm64 packages include the server, MIT license, upstream NOTICE, and dependency license texts. The Komari API compatibility version remains 1.6.0. This release contains the ShellBeam service entry page; use the ShellBeam client for administration.'
